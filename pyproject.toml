[project]
name = "datocomun-feed"
version = "0.2.0"
description = "Cliente Python para Recuento API (Dato Común)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datocomun_feed"]
